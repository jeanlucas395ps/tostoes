# API PHP no Docker → MySQL da máquina (host.docker.internal)
# Banco local: tostoes (root / root)

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gastos-api
    restart: unless-stopped
    ports:
      - "8090:80"
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
