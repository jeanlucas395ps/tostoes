<ion-content [fullscreen]="true">
  <div class="auth-hero" style="height: 26vh; min-height: 180px;">
    <div class="hero-content">
      <app-brand-mark variant="light" />
      <div class="hero-title" style="font-size: 1.375rem;">Nova senha</div>
      <div class="hero-subtitle">Escolha uma senha com pelo menos 8 caracteres</div>
    </div>
  </div>

  <div class="auth-sheet">
    <form (ngSubmit)="submit()">
      <label class="field">
        <span class="field-label">Nova senha</span>
        <input type="password" name="password" autocomplete="new-password" [(ngModel)]="password" />
      </label>
      <label class="field">
        <span class="field-label">Confirmar senha</span>
        <input
          type="password"
          name="passwordConfirm"
          autocomplete="new-password"
          [(ngModel)]="passwordConfirm"
        />
      </label>

      @if (error()) {
        <p class="field-error">{{ error() }}</p>
      }
      @if (success()) {
        <p class="field-success">{{ success() }}</p>
      }

      <button class="btn-brand submit-btn" type="submit" [disabled]="loading()">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Redefinir senha
        }
      </button>
    </form>

    <div class="auth-links center">
      <a routerLink="/login">Voltar para o login</a>
    </div>
  </div>
</ion-content>
