<ion-content [fullscreen]="true">
  <div class="auth-hero" style="height: 26vh; min-height: 180px;">
    <div class="hero-content">
      <app-brand-mark variant="light" />
      <div class="hero-title" style="font-size: 1.375rem;">Esqueci minha senha</div>
      <div class="hero-subtitle">Vamos te enviar um link de redefinição</div>
    </div>
  </div>

  <div class="auth-sheet">
    <form (ngSubmit)="submit()">
      <label class="field">
        <span class="field-label">E-mail</span>
        <input type="email" name="email" autocomplete="email" [(ngModel)]="email" />
      </label>

      @if (error()) {
        <p class="field-error">{{ error() }}</p>
      }
      @if (success()) {
        <p class="field-success">{{ success() }}</p>
      }

      <button class="btn-brand submit-btn" type="submit" [disabled]="loading()">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Enviar link
        }
      </button>
    </form>

    <div class="auth-links center">
      <a routerLink="/login">Voltar para o login</a>
    </div>
  </div>
</ion-content>
