<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal sheet" (click)="$event.stopPropagation()">
    <div class="sheet-handle"></div>
    <h3>{{ title() }}</h3>
    <p class="entry-name">{{ entry().name }}</p>

    @if (canEditKind()) {
      <label class="field">
        <span class="field-label">Tipo</span>
        <select class="select" [(ngModel)]="editKind">
          @for (k of kindOptions; track k) {
            <option [value]="k">{{ kindLabels[k] }}</option>
          }
        </select>
      </label>
    }

    @if (isTransfer()) {
      <label class="field">
        <span class="field-label">De</span>
        <select class="select" [(ngModel)]="sourceAccountId">
          <option [ngValue]="null">Selecione</option>
          @for (a of allAccounts(); track a.id) {
            <option [ngValue]="a.id">{{ a.name }} · {{ accountTypeShort(a.type) }}</option>
          }
        </select>
      </label>
      <label class="field">
        <span class="field-label">Para</span>
        <select class="select" [(ngModel)]="targetAccountId">
          <option [ngValue]="null">Selecione</option>
          @for (a of allAccounts(); track a.id) {
            <option [ngValue]="a.id">{{ a.name }} · {{ accountTypeShort(a.type) }}</option>
          }
        </select>
      </label>

      <div class="amount-row">
        <label class="field grow">
          <span class="field-label">Valor enviado</span>
          <input
            class="num"
            type="number"
            inputmode="decimal"
            [(ngModel)]="editAmount"
            (ngModelChange)="onOutCurrencyOrAmountChange()"
          />
        </label>
        <label class="field currency-field">
          <span class="field-label">Moeda</span>
          <select class="select" [(ngModel)]="editCurrency" (ngModelChange)="onOutCurrencyOrAmountChange()">
            <option value="BRL">R$</option>
            <option value="EUR">€</option>
            <option value="USD">US$</option>
          </select>
        </label>
      </div>

      <div class="amount-row">
        <label class="field grow">
          <span class="field-label">Valor recebido</span>
          <input class="num" type="number" inputmode="decimal" [(ngModel)]="editAmountIn" />
        </label>
        <label class="field currency-field">
          <span class="field-label">Moeda</span>
          <select class="select" [(ngModel)]="editCurrencyIn">
            <option value="BRL">R$</option>
            <option value="EUR">€</option>
            <option value="USD">US$</option>
          </select>
        </label>
      </div>
    } @else {
      <div class="amount-row">
        <label class="field grow">
          <span class="field-label">Valor</span>
          <input class="num" type="number" inputmode="decimal" [(ngModel)]="editAmount" />
        </label>
        <label class="field currency-field">
          <span class="field-label">Moeda</span>
          <select class="select" [(ngModel)]="editCurrency">
            <option value="BRL">R$</option>
            <option value="EUR">€</option>
            <option value="USD">US$</option>
          </select>
        </label>
      </div>

      @if (isInvestment()) {
        <label class="field">
          <span class="field-label">Conta banco (saída)</span>
          <select class="select" [(ngModel)]="bankAccountId">
            <option [ngValue]="null">Selecione</option>
            @for (a of bankAccounts(); track a.id) {
              <option [ngValue]="a.id">{{ a.name }} · {{ accountBalanceLabel(a) }}</option>
            }
          </select>
        </label>
        <label class="field">
          <span class="field-label">Conta investimento (destino)</span>
          <select class="select" [(ngModel)]="investmentAccountId">
            <option [ngValue]="null">Selecione</option>
            @for (a of investmentAccounts(); track a.id) {
              <option [ngValue]="a.id">{{ a.name }}</option>
            }
          </select>
        </label>
      } @else {
        <label class="field">
          <span class="field-label">Conta</span>
          <select class="select" [(ngModel)]="bankAccountId">
            <option [ngValue]="null">Selecione</option>
            @for (a of defaultAccountOptions(); track a.id) {
              <option [ngValue]="a.id">{{ a.name }} · {{ accountBalanceLabel(a) }}</option>
            }
          </select>
        </label>
      }
    }

    <div class="modal-actions">
      <button class="btn-soft" type="button" (click)="cancelled.emit()">Cancelar</button>
      <button class="btn-brand" type="button" [disabled]="!canSubmit()" (click)="submit()">Confirmar</button>
    </div>
  </div>
</div>
