<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Tostoes , Controle Financeiro</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <script>
    (function () {
      var host = location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1';
      if (!isLocal && location.protocol === 'http:') {
        location.replace(
          'https://' + location.host + location.pathname + location.search + location.hash
        );
      }
    })();
  </script>

  <!-- Fonts: Public Sans (UI) + JetBrains Mono (números) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600;700&display=swap"
    rel="stylesheet"
  >
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('tostoes-theme');
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
