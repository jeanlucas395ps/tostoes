<div class="auth-shell">

  <!-- Cover panel , desktop only -->
  <div class="auth-cover">
    <div class="cover-inner">
      <div class="cover-logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 0 1 0 4H8"/>
            <path d="M12 6v2M12 16v2"/>
          </svg>
        </div>
        <span>Tostoes</span>
      </div>
      <h2 class="cover-heading">Defina uma<br>nova senha</h2>
      <p class="cover-text">Escolha uma senha segura de pelo menos 8 caracteres para proteger sua conta.</p>
    </div>
  </div>

  <!-- Form panel -->
  <div class="auth-form-panel">
    <div class="auth-form-inner">

      <div class="form-header">
        <h1>Nova senha</h1>
        <p>Defina uma senha segura para sua conta</p>
      </div>

      <form (ngSubmit)="submit()">
        <div class="field">
          <label for="rp-pwd">Nova senha</label>
          <input
            id="rp-pwd"
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="Mínimo 8 caracteres"
          />
        </div>

        <div class="field">
          <label for="rp-confirm">Confirmar senha</label>
          <input
            id="rp-confirm"
            type="password"
            name="passwordConfirm"
            [(ngModel)]="passwordConfirm"
            autocomplete="new-password"
            required
            placeholder="Repita a nova senha"
          />
        </div>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        @if (success()) {
          <p class="success">{{ success() }}</p>
        }

        <button type="submit" class="btn-submit" [disabled]="loading() || !!success()">
          {{ loading() ? 'Salvando…' : (success() ? 'Senha redefinida ✓' : 'Salvar nova senha') }}
        </button>
      </form>

      <p class="foot-link">
        <a routerLink="/login">← Ir para o login</a>
        &nbsp;·&nbsp;
        <a routerLink="/recuperar-senha">Solicitar novo link</a>
      </p>

    </div>
  </div>

</div>
