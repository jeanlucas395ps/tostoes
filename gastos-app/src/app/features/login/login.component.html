<div class="login-shell">
  <div class="login-cover">
    <div class="cover-inner">
      <div class="cover-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 0 1 0 4H8"/>
          <path d="M12 6v2"/>
          <path d="M12 16v2"/>
        </svg>
        <span>Tostoes</span>
      </div>
      <h2>Controle financeiro<br>do casal</h2>
      <p>Gerencie ganhos, gastos e investimentos juntos com visibilidade total.</p>
      <div class="cover-dots" aria-hidden="true">
        @for (i of dots; track i) { <span></span> }
      </div>
    </div>
  </div>

  <div class="login-form-panel">
    <div class="form-inner">
      <div class="form-header">
        <h1>Entrar</h1>
        <p>Bem-vindo de volta</p>
      </div>

      <form (ngSubmit)="submit()">
        <div class="field">
          <label for="uname">Usuário</label>
          <input id="uname" type="text" name="user" [(ngModel)]="user" autocomplete="username" placeholder="Usuário" required />
        </div>
        <div class="field">
          <label for="pwd">Senha</label>
          <input id="pwd" type="password" name="password" [(ngModel)]="password" placeholder="Senha" autocomplete="current-password" required />
        </div>
        <p class="field-link">
          <a routerLink="/recuperar-senha">Esqueci minha senha</a>
        </p>
        @if (error()) {
          <p class="form-error">{{ error() }}</p>
        }
        <button type="submit" class="btn-submit" [disabled]="loading()">
          {{ loading() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>

      <p class="foot-link">
        Não tem conta? <a routerLink="/cadastro" [queryParams]="redirect ? { redirect } : {}">Criar conta</a>
      </p>
    </div>
  </div>
</div>
